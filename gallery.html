<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="See pressure-washing results from Seven Six Pressure Washing LLC.">
    <title>Gallery | Seven Six Pressure Washing LLC</title>
    <link rel="stylesheet" href="styles.css?v=20260911i">
    <style>
      .gallery-page {
        aspect-ratio: auto;
        min-height: 100vh;
        overflow: visible;
        padding-bottom: 18px;
        background: #001426;
      }

      .gallery-top {
        position: relative;
        width: 100%;
        aspect-ratio: 492 / 224;
        overflow: hidden;
        background: #001426;
        line-height: 0;
      }

      .gallery-top .page-art {
        position: absolute;
        z-index: 0;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        object-fit: initial;
      }

      .gallery-top .g-logo,
      .gallery-top .g-home,
      .gallery-top .g-gallery,
      .gallery-top .g-quote,
      .gallery-top .g-phone {
        height: 25.3%;
      }

      .gallery-top .gallery-filters {
        top: 82.3%;
        height: 13.8%;
      }

      .real-gallery-grid {
        position: relative;
        z-index: 20;
        left: auto;
        top: auto;
        width: 95.7%;
        height: auto;
        margin: 8px auto 0;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: none;
        grid-auto-rows: clamp(250px, 66vw, 500px);
        gap: 8px;
        padding: 4px;
        background: #001426;
        line-height: 1;
      }

      .gallery-card img,
      .gallery-card.portrait img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      @media (min-width: 760px) {
        .real-gallery-grid {
          grid-auto-rows: 500px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell gallery-page">
      <section class="gallery-top" aria-label="Gallery header">
        <img class="page-art" src="assets/gallery.webp?v=20260911c" width="492" height="994" alt="Seven Six Pressure Washing before-and-after project gallery">

        <a class="hotspot g-logo" href="index.html" aria-label="Seven Six Pressure Washing home"></a>
        <a class="hotspot g-home" href="index.html" aria-label="Home"></a>
        <a class="hotspot g-gallery" href="gallery.html" aria-label="Gallery" aria-current="page"></a>
        <a class="hotspot g-quote" href="quote.html" aria-label="Get a Quote"></a>
        <a class="hotspot g-phone" href="tel:+12766348064" aria-label="Call 276-634-8064"></a>

        <div class="gallery-filters" role="group" aria-label="Filter gallery">
          <button class="gallery-filter active" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="gallery-filter" type="button" data-filter="houses" aria-pressed="false">Houses</button>
          <button class="gallery-filter" type="button" data-filter="driveways" aria-pressed="false">Driveways</button>
          <button class="gallery-filter" type="button" data-filter="sidewalks" aria-pressed="false">Sidewalks</button>
          <button class="gallery-filter" type="button" data-filter="patios" aria-pressed="false">Patios &amp; Decks</button>
          <button class="gallery-filter" type="button" data-filter="commercial" aria-pressed="false">Commercial</button>
        </div>
      </section>

      <section class="real-gallery-grid" aria-label="Recent pressure-washing projects">
        <button class="gallery-card landscape" type="button" data-category="houses" aria-label="View house siding before cleaning">
          <img src="assets/gallery/house-gable-before.webp" width="1560" height="1170" alt="House siding before pressure washing" decoding="async">
          <span class="gallery-label before">Before</span>
        </button>
        <button class="gallery-card landscape" type="button" data-category="houses" aria-label="View house siding after cleaning">
          <img src="assets/gallery/house-gable-after.webp" width="1560" height="1170" alt="House siding after pressure washing" decoding="async">
          <span class="gallery-label after">After</span>
        </button>

        <button class="gallery-card portrait" type="button" data-category="houses" aria-label="View downspout before cleaning">
          <img src="assets/gallery/downspout-before.webp" width="1170" height="1560" alt="House siding and downspout before cleaning" loading="lazy" decoding="async">
          <span class="gallery-label before">Before</span>
        </button>
        <button class="gallery-card portrait" type="button" data-category="houses" aria-label="View downspout after cleaning">
          <img src="assets/gallery/downspout-after.webp" width="1170" height="1560" alt="House siding and downspout after cleaning" loading="lazy" decoding="async">
          <span class="gallery-label after">After</span>
        </button>

        <button class="gallery-card landscape" type="button" data-category="houses" aria-label="View two-story siding before cleaning">
          <img src="assets/gallery/house-side-before.webp" width="1560" height="1170" alt="Two-story house siding before pressure washing" loading="lazy" decoding="async">
          <span class="gallery-label before">Before</span>
        </button>
        <button class="gallery-card portrait" type="button" data-category="houses" aria-label="View two-story siding after cleaning">
          <img src="assets/gallery/house-side-after.webp" width="1170" height="1560" alt="Two-story house siding after pressure washing" loading="lazy" decoding="async">
          <span class="gallery-label after">After</span>
        </button>

        <button class="gallery-card landscape" type="button" data-category="houses" aria-label="View front siding before cleaning">
          <img src="assets/gallery/house-front-before.webp" width="1560" height="1170" alt="Front of house before pressure washing" loading="lazy" decoding="async">
          <span class="gallery-label before">Before</span>
        </button>
        <button class="gallery-card portrait" type="button" data-category="houses" aria-label="View front siding after cleaning">
          <img src="assets/gallery/house-front-after.webp" width="1170" height="1560" alt="Front of house after pressure washing" loading="lazy" decoding="async">
          <span class="gallery-label after">After</span>
        </button>

        <button class="gallery-card portrait" type="button" data-category="sidewalks" aria-label="View walkway before cleaning">
          <img src="assets/gallery/walkway-before.webp" width="1170" height="1560" alt="Concrete walkway before pressure washing" loading="lazy" decoding="async">
          <span class="gallery-label before">Before</span>
        </button>
        <button class="gallery-card portrait" type="button" data-category="sidewalks" aria-label="View walkway after cleaning">
          <img src="assets/gallery/walkway-after.webp" width="1170" height="1560" alt="Concrete walkway after pressure washing" loading="lazy" decoding="async">
          <span class="gallery-label after">After</span>
        </button>

        <button class="gallery-card portrait" type="button" data-category="houses" aria-label="View pressure washing in progress">
          <img src="assets/gallery/washing-in-progress.webp" width="1170" height="1560" alt="Pressure washing a house in progress" loading="lazy" decoding="async">
          <span class="gallery-label progress">In Progress</span>
        </button>
        <button class="gallery-card portrait" type="button" data-category="houses" aria-label="View clean house corner">
          <img src="assets/gallery/house-corner-after.webp" width="1170" height="1560" alt="House corner and siding after pressure washing" loading="lazy" decoding="async">
          <span class="gallery-label after">After</span>
        </button>
      </section>

      <div id="galleryLightbox" class="gallery-lightbox" role="dialog" aria-modal="true" aria-label="Gallery photo viewer" aria-hidden="true">
        <button class="gallery-lightbox-close" type="button" aria-label="Close photo viewer">&times;</button>
        <img id="galleryLightboxImage" alt="">
        <p id="galleryLightboxCaption"></p>
      </div>
    </main>
    <script src="script.js?v=20260911i"></script>
  </body>
</html>
